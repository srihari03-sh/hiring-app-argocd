apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-app
  namespace: myapp

spec:
  replicas: 6

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:
      containers:
      - name: my-app
        image: srihari0310/hiring-app:3
        ports:
        - containerPort: 8080
